[project]
name = "mt-via-round-trip-rl"
version = "0.1.0"
description = "Low-resource MT via round-trip reinforcement learning (GRPO) with NLLB"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch==2.8.0",
    "transformers==4.57.1",
    "datasets==3.6.0", # <4: breakend/nllb-multi-domain uses a loading script
    "sacrebleu==2.5.1",
    "hydra-core==1.3.2",
    "omegaconf==2.3.0",
    "wandb>=0.19,<0.23",
    "numpy>=1.26,<3",
    "sentencepiece>=0.2.0",
    "protobuf>=4.25",
    "accelerate>=1.0,<2",
    "tqdm",
]

[tool.uv]
package = false
